; CYD Street Light - ESP32 medidora do poste: mede tensao/corrente e publica
; via DDS. O display (CYD) que assina as medicoes fica na branch
; DDS_CYD_Implementation; a comunicacao (lib/StreetLightDDS) e a mesma nas duas.

[platformio]
src_dir = src

[env:medidor]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
monitor_dtr = 0
monitor_rts = 0
upload_speed = 230400   ; mais estavel via USB/IP (WSL)
build_src_filter = +<*> -<teste/>

; Teste do sensor de corrente: so mostra a tensao do GPIO34 no serial
; (sem Wi-Fi/DDS). pio run -e teste_sensor -t upload
[env:teste_sensor]
extends = env:medidor
build_src_filter = +<teste/sensor_teste.cpp>
