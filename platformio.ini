; CYD Street Light - display (CYD) que assina as medicoes do poste via DDS.
; O firmware da ESP medidora fica na branch DDS_ESP32_Implementation;
; a comunicacao (lib/StreetLightDDS) e a mesma nas duas.

[platformio]
src_dir = src

[env:esp32-2432S028]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
monitor_dtr = 0
monitor_rts = 0
board_build.partitions = huge_app.csv

lib_deps =
    lvgl/lvgl@9.5.0
    bodmer/TFT_eSPI@2.5.43
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git

build_flags =
    -D USER_SETUP_LOADED=1
    -D ILI9341_2_DRIVER=1
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    -D TFT_INVERSION_ON=1      ; o painel desta CYD vem com as cores invertidas
    -D SPI_FREQUENCY=55000000
    -D SPI_READ_FREQUENCY=2000000
    -D SPI_TOUCH_FREQUENCY=2500000
    -D TOUCH_CS=33
    -D SMOOTH_FONT=1
    -D LV_CONF_SKIP
    -D LV_CONF_INCLUDE_SIMPLE
    -D LV_USE_STDLIB_MALLOC=1   ; LV_STDLIB_CLIB: heap do sistema (sem pool estatico de 64KB)
    -D LV_FONT_MONTSERRAT_12=1
    -D LV_FONT_MONTSERRAT_14=1
    -D LV_FONT_MONTSERRAT_18=1
    -D LV_FONT_MONTSERRAT_48=1
